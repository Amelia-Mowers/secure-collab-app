# TideWork billing Worker (ADR 0002 phase D): Stripe ↔ MAS.
# The one non-open-core-adjacent component — deliberately tiny. Stripe is the
# database: the registration token + username live on the subscription's
# metadata, so there is no KV/state here at all.
name = "tidework-billing"
main = "src/index.ts"
compatibility_date = "2026-05-01"

routes = [
  { pattern = "billing.tidework.io", custom_domain = true },
]

# Lock unpaid accounts past the trial, four times a day.
[triggers]
crons = ["13 */6 * * *"]

[vars]
MAS_URL = "https://auth.tidework.io"
MAS_BILLING_CLIENT_ID = "00000000000000000000STR1PE"
PRICE_CENTS = "1200"
PRICE_CURRENCY = "usd"
TRIAL_DAYS = "14"
# Days after the trial ends before the sweep locks. Absorbs a retried card, a
# renewal in flight, and timezone drift on `created_at`. "0" = lock on the dot.
GRACE_DAYS = "3"
# Days past the LOCK deadline after which a never-paid locked account is
# deactivated + GDPR-erased (ADR 0002's one exception to lock-never-deactivate).
# "0" disables deletion entirely.
DELETE_AFTER_DAYS = "60"
# Deletion is irreversible, so it is opt-in: "report" logs what it would delete
# and changes nothing. Flip to "apply" once the reported list looks right.
DELETE_MODE = "report"
# Operator/test accounts the sweep must never lock.
EXEMPT_USERNAMES = "opcheck,opcheck2"
SITE_URL = "https://tidework.io"
APP_URL = "https://app.tidework.io"
# Matrix homeserver — verifies OpenID tokens for /portal (manage/cancel). The
# server name pins which server the token may come from (anti-SSRF).
HOMESERVER_URL = "https://matrix.tidework.io"
MATRIX_SERVER_NAME = "tidework.io"

# Secrets (pushed by CI via `wrangler secret put` from GitHub secrets — the
# recorded two-tier exception, since Cloudflare is this component's runtime):
#   STRIPE_API_KEY
#   STRIPE_WEBHOOK_SIGNING_SECRET
#   MAS_BILLING_CLIENT_SECRET
