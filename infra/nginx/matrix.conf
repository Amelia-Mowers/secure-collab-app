# matrix.tidework.io → Synapse (client + federation over 443; federation is
# delegated here by the apex .well-known, so no port 8448 anywhere).
#
# TLS lives HERE, in the repo-managed config — certbot only obtains/renews
# the certificate (certonly), it never edits these files. Both hostnames
# share one cert under the matrix.tidework.io lineage.
#
# Workers (ADR 0002 amendment): read/sync endpoints route to the generic "sync"
# workers (synapse-sync1/2, published on 127.0.0.1:8081/8082), sticky by access
# token; everything else (sends, account, media, keys, federation) goes to the
# main process on :8008.

upstream synapse_main {
    server 127.0.0.1:8008;
}

upstream synapse_sync {
    # Sticky per access token so a client's /sync keeps landing on one worker.
    hash $http_authorization consistent;
    server 127.0.0.1:8081;
    server 127.0.0.1:8082;
}

server {
    listen 80;
    listen [::]:80;
    server_name matrix.tidework.io;

    # ACME HTTP-01 renewals; everything else goes to TLS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name matrix.tidework.io;

    ssl_certificate /etc/letsencrypt/live/matrix.tidework.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.tidework.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Common proxy settings, inherited by every location below (none redefine
    # proxy_set_header, so inheritance applies). Matrix C-S API long-polls
    # /sync — keep timeouts generous.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_read_timeout 330s;
    proxy_send_timeout 330s;
    client_max_body_size 50M;

    # Read / sync endpoints → generic sync workers. The `$` anchors keep writes
    # (e.g. PUT /rooms/.../state/<type>, /send/...) on the catch-all → main.
    location ~ ^/_matrix/client/(r0|v3|unstable)/sync$                          { proxy_pass http://synapse_sync; }
    location ~ ^/_matrix/client/(api/v1|r0|v3)/events$                          { proxy_pass http://synapse_sync; }
    location ~ ^/_matrix/client/(api/v1|r0|v3)/initialSync$                     { proxy_pass http://synapse_sync; }
    location ~ ^/_matrix/client/(api/v1|r0|v3)/rooms/[^/]+/initialSync$         { proxy_pass http://synapse_sync; }
    location ~ ^/_matrix/client/(r0|v3|unstable)/rooms/[^/]+/messages$          { proxy_pass http://synapse_sync; }
    location ~ ^/_matrix/client/(r0|v3|unstable)/rooms/[^/]+/(joined_)?members$ { proxy_pass http://synapse_sync; }
    location ~ ^/_matrix/client/(r0|v3|unstable)/rooms/[^/]+/state$             { proxy_pass http://synapse_sync; }
    location ~ ^/_matrix/client/(r0|v3|unstable)/rooms/[^/]+/context/           { proxy_pass http://synapse_sync; }

    # Everything else (sends, account, media, keys, federation, MAS-delegated) → main.
    location / {
        proxy_pass http://synapse_main;
    }
}
