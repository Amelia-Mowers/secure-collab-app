# auth.tidework.io → MAS (OIDC issuer + hosted sign-in/account pages).
# TLS is repo-managed (see matrix.conf header) — certbot renews only.

server {
    listen 80;
    listen [::]:80;
    server_name auth.tidework.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.tidework.io;

    ssl_certificate /etc/letsencrypt/live/matrix.tidework.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.tidework.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        client_max_body_size 1M;
    }
}
