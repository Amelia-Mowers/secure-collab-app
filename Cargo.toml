[workspace]
members = [
    "crates/tables-over-matrix",
    "crates/app-core",
    "crates/cli",
]
# The native `cli` binary is excluded from default (whole-workspace) commands so
# they keep resolving the wasm-default features for the two library crates.
# Build/test the cli explicitly with `-p tidework-cli` (it pulls app-core with
# `matrix-native`, default features off, so wasm + native never unify).
default-members = [
    "crates/tables-over-matrix",
    "crates/app-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Secure Collab Contributors"]

[workspace.dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

# Matrix SDK — default-features off; sub-crates enable indexeddb + js for WASM.
# Using 0.14 to avoid rustc 1.94 query depth overflow in 0.16's sync() impl.
# rustls-tls works in both native and WASM contexts (no system OpenSSL needed).
matrix-sdk = { version = "0.14", default-features = false, features = ["e2e-encryption", "rustls-tls"] }
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-wasm = "0.2"

# WASM bindings
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

# Testing
proptest = "1.4"
quickcheck = "1.0"

# Formula columns: the Typst PARSER only. typst-syntax is standalone (unicode
# tables + ecow + unscanny), so formulas are real Typst syntax without the
# compiler. `typst-eval` is deliberately NOT used — it pulls typst-library (the
# whole stdlib + layout types) and `stacker`, into a wasm bundle that is already
# 10.7 MB. See crates/app-core/src/formula.rs for the evaluation boundary.
typst-syntax = "0.15"

# Time and UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde", "js"] }

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
# panic = "unwind" (the default), NOT abort.
#
# A production panic reached us as exactly this and nothing else:
#
#   RuntimeError: unreachable executed  app_core_bg-D_axPbry.wasm:8640453:1
#
# No message, no file, no line — an offset into a stripped, wasm-opt'd binary,
# which is not a location anybody can act on. The panic also POISONS the
# module: every later call traps, so the tab silently stops working until it is
# reloaded, and the user's first symptom is that nothing happens any more.
#
# Unwinding lets `console_error_panic_hook` print the panic message and the
# source location it came from. The strings for those live in the binary
# regardless of `strip` (which drops symbols, not panic metadata), so this
# costs a little size and buys the difference between a bug report we can act
# on and one we can only speculate about. We had one of each this week.
panic = "unwind"
strip = true        # Strip symbols from binary

[profile.release.package."*"]
opt-level = "z"
strip = true
