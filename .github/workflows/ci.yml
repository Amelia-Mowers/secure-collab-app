name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Run unit tests without Matrix or WASM features (pure logic tests)
      - name: Run unit tests
        run: cargo test -p tables-over-matrix --no-default-features

      # Run unit tests with Matrix SDK on native (sqlite store)
      - name: Run Matrix unit tests
        run: cargo test -p tables-over-matrix --no-default-features --features matrix-native --lib

      # Run app-core tests without WASM features
      - name: Run app-core tests
        run: cargo test -p app-core --no-default-features

      # Run app-core tests with Matrix SDK on native (sqlite store)
      - name: Run app-core Matrix unit tests
        run: cargo test -p app-core --no-default-features --features matrix-native --lib

      - name: Run doctests
        run: cargo test -p tables-over-matrix --no-default-features --doc

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Lint core library (no WASM or Matrix features)
      - name: Clippy (core)
        run: cargo clippy -p tables-over-matrix --no-default-features --all-targets -- -D warnings
      # Lint with Matrix SDK on native (sqlite store)
      - name: Clippy (matrix-native)
        run: cargo clippy -p tables-over-matrix --no-default-features --features matrix-native --all-targets -- -D warnings
      # Lint app-core (no WASM features)
      - name: Clippy (app-core)
        run: cargo clippy -p app-core --no-default-features --all-targets -- -D warnings
      # Lint app-core with Matrix SDK on native
      - name: Clippy (app-core matrix-native)
        run: cargo clippy -p app-core --no-default-features --features matrix-native --all-targets -- -D warnings

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        working-directory: crates/app-core
        run: wasm-pack build --target web --no-default-features --features wasm,matrix-wasm

  ui:
    name: UI Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        working-directory: crates/app-core
        run: wasm-pack build --target web --out-dir ../../ui/src/wasm --no-default-features --features wasm,matrix-wasm

      - name: Restore hand-written loader
        run: git checkout -- ui/src/wasm/loader.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Type check
        working-directory: ui
        run: npm run type-check

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Test
        working-directory: ui
        run: npm run test -- --run

      - name: Build
        working-directory: ui
        run: npm run build

  integration:
    name: Matrix Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run tables-over-matrix integration tests
        run: |
          nix develop --command cargo test \
            -p tables-over-matrix \
            --no-default-features \
            --features matrix-native \
            -- --ignored --nocapture

      - name: Run app-core integration tests
        run: |
          nix develop --command cargo test \
            -p app-core \
            --no-default-features \
            --features matrix-native \
            --test workspace_matrix \
            -- --ignored --nocapture --test-threads=4

  e2e:
    name: E2E (two-browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Build the WASM bindings the dev server serves (the same artifacts the
      # `ui` job builds), then restore the hand-written loader wasm-pack clobbers.
      - name: Build WASM bindings
        run: |
          nix develop --command bash -c "cd crates/app-core && wasm-pack build --target web --out-dir ../../ui/src/wasm --no-default-features --features wasm,matrix-wasm"
          git checkout -- ui/src/wasm/loader.ts

      # Nix provides the Playwright browsers (PLAYWRIGHT_BROWSERS_PATH), so skip
      # the npm postinstall download.
      - name: Install UI dependencies
        run: nix develop --command bash -c "cd ui && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci"

      - name: Run two-browser E2E tests
        run: nix develop --command bash -c "cd ui && npm run e2e"

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, fmt, clippy, ui]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        working-directory: crates/app-core
        run: wasm-pack build --target web --out-dir ../../ui/src/wasm --no-default-features --features wasm,matrix-wasm

      - name: Restore hand-written loader
        run: git checkout -- ui/src/wasm/loader.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI for GitHub Pages
        working-directory: ui
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
