name: CI

on:
  push:
    branches: [ main ]
    # A version tag is what ships. Merging to main proves a change is good;
    # tagging is the separate, deliberate act of putting it in front of users.
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  # Hotfix hatch: deploy the current ref without cutting a version.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A newer push on the same ref cancels the in-flight run, so we don't pay for
# two ~10-minute runs when commits land in quick succession.
#
# EXCEPT where the run can deploy — a tag, or a manual dispatch. Cancelling one
# of those throws away a finished build that was about to go live, and a
# cancelled queued run is indistinguishable from a slow one. Pull requests are
# the only place the saving is free, so they are the only place it applies.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Gate the expensive jobs (integration + both E2E suites) so doc/markdown-only
  # PRs don't pay for them. `.github/workflows/**` is included so changes to this
  # file still exercise the heavy jobs they configure.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            relevant:
              - 'crates/**'
              - 'ui/**'
              - 'billing/**'
              - 'scripts/**'
              - 'flake.nix'
              - 'flake.lock'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      # Run unit tests without Matrix or WASM features (pure logic tests)
      - name: Run unit tests
        run: cargo test -p tables-over-matrix --no-default-features

      # Run unit tests with Matrix SDK on native (sqlite store)
      - name: Run Matrix unit tests
        run: cargo test -p tables-over-matrix --no-default-features --features matrix-native --lib

      # Run app-core tests without WASM features
      - name: Run app-core tests
        run: cargo test -p app-core --no-default-features

      # Run app-core tests with Matrix SDK on native (sqlite store)
      - name: Run app-core Matrix unit tests
        run: cargo test -p app-core --no-default-features --features matrix-native --lib

      - name: Run doctests
        run: cargo test -p tables-over-matrix --no-default-features --doc

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Lint core library (no WASM or Matrix features)
      - name: Clippy (core)
        run: cargo clippy -p tables-over-matrix --no-default-features --all-targets -- -D warnings
      # Lint with Matrix SDK on native (sqlite store)
      - name: Clippy (matrix-native)
        run: cargo clippy -p tables-over-matrix --no-default-features --features matrix-native --all-targets -- -D warnings
      # Lint app-core (no WASM features)
      - name: Clippy (app-core)
        run: cargo clippy -p app-core --no-default-features --all-targets -- -D warnings
      # Lint app-core with Matrix SDK on native
      - name: Clippy (app-core matrix-native)
        run: cargo clippy -p app-core --no-default-features --features matrix-native --all-targets -- -D warnings
      # Lint the native CLI (pulls app-core + tables-over-matrix with
      # matrix-native; this is the only job that compiles the cli crate).
      - name: Clippy (cli)
        run: cargo clippy -p tidework-cli --all-targets -- -D warnings

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # Build the bindings once and share them with the ui + E2E jobs via an
      # artifact, so those jobs need neither a Rust toolchain nor a rebuild.
      - name: Build WASM
        working-directory: crates/app-core
        run: wasm-pack build --target web --out-dir ../../ui/src/wasm/generated --no-default-features --features wasm,matrix-wasm

      # The memory ceiling is stated in three places (linker arg, built module,
      # and a TypeScript constant used to report how close a crash was to it)
      # with nothing linking them. Lowering it fails silently and unreadably —
      # see the script's docstring for the production crash that prompted this.
      - name: Check the wasm memory ceiling
        run: python3 scripts/check-wasm-memory.py

      - name: Upload WASM bindings
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bindings
          path: ui/src/wasm/generated/
          retention-days: 1

  ui:
    name: UI Build and Test
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4

      # Reuse the bindings the `wasm` job built — no Rust toolchain needed here.
      - name: Download WASM bindings
        uses: actions/download-artifact@v4
        with:
          name: wasm-bindings
          path: ui/src/wasm/generated

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ui
        run: npm ci

      - name: Type check
        working-directory: ui
        run: npm run type-check

      - name: Lint
        working-directory: ui
        run: npm run lint

      - name: Test
        working-directory: ui
        run: npm run test -- --run

      - name: Build
        working-directory: ui
        run: npm run build

  billing:
    name: Billing Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: billing/package-lock.json

      - name: Install dependencies
        working-directory: billing
        run: npm ci

      # The Worker ships via `wrangler deploy`, which bundles with esbuild and
      # does NOT type-check — so until now a type error in the billing Worker
      # reached production and was only discoverable by hitting the endpoint.
      # This is the whole point of the job.
      - name: Type check
        working-directory: billing
        run: npm run type-check

  integration:
    name: Matrix Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.relevant == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # Synapse (Docker) + the Nix store + Rust target fill the 14 GB runner;
      # reclaim the big preinstalled SDKs up front so the job doesn't die on
      # "No space left on device". Skip the slow apt purge and keep Docker.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        # Upload new store paths only from main: GHA cache writes are
        # REF-scoped, so every PR's first run re-uploaded the whole store
        # (~9 min "Post Cache Nix store" tail) to its own scope. Restores
        # read main's caches cross-ref, so PRs keep the hit.
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: ${{ github.ref == 'refs/heads/main' }}

      # The matrix-sdk stack is the bulk of this job. Cache the Rust build
      # output under a key distinct from the rustup jobs (the nix toolchain's
      # artifacts aren't interchangeable) and busted by flake.lock changes.
      - name: Cache Cargo (nix)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-nix-integration-${{ hashFiles('**/Cargo.lock', 'flake.lock') }}
          restore-keys: ${{ runner.os }}-cargo-nix-integration-

      - name: Run tables-over-matrix integration tests
        run: |
          nix develop --command cargo test \
            -p tables-over-matrix \
            --no-default-features \
            --features matrix-native \
            -- --ignored --nocapture --test-threads=4

      - name: Run app-core integration tests
        run: |
          nix develop --command cargo test \
            -p app-core \
            --no-default-features \
            --features matrix-native \
            --test workspace_matrix \
            -- --ignored --nocapture --test-threads=4

  e2e:
    name: E2E (two-browser)
    runs-on: ubuntu-latest
    needs: [changes, wasm]
    if: needs.changes.outputs.relevant == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        # Upload new store paths only from main: GHA cache writes are
        # REF-scoped, so every PR's first run re-uploaded the whole store
        # (~9 min "Post Cache Nix store" tail) to its own scope. Restores
        # read main's caches cross-ref, so PRs keep the hit.
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: ${{ github.ref == 'refs/heads/main' }}

      # Reuse the bindings the `wasm` job built — the dev server serves these.
      # No Rust toolchain or compile in this job.
      - name: Download WASM bindings
        uses: actions/download-artifact@v4
        with:
          name: wasm-bindings
          path: ui/src/wasm/generated

      # node_modules restored whole (runner arch is fixed, key covers the
      # lockfile + nix pin) — npm ci ran ~2.5 min on this job's critical path.
      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: ui-node-modules-${{ hashFiles('ui/package-lock.json', 'flake.lock') }}

      # Nix provides the Playwright browsers (PLAYWRIGHT_BROWSERS_PATH), so skip
      # the npm postinstall download.
      - name: Install UI dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: nix develop --command bash -c "cd ui && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci"

      - name: Run two-browser E2E tests
        run: nix develop --command bash -c "cd ui && npm run e2e"

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # test-results/ too: that is where the traces and error contexts land.
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7

  e2e-oauth:
    name: E2E (OAuth / Synapse+MAS)
    runs-on: ubuntu-latest
    needs: [changes, wasm]
    if: needs.changes.outputs.relevant == 'true' || github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      # Synapse + MAS + Postgres (Docker) on top of Nix is the heaviest job —
      # reclaim space up front to avoid "No space left on device".
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false
          tool-cache: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        # Upload new store paths only from main: GHA cache writes are
        # REF-scoped, so every PR's first run re-uploaded the whole store
        # (~9 min "Post Cache Nix store" tail) to its own scope. Restores
        # read main's caches cross-ref, so PRs keep the hit.
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Download WASM bindings
        uses: actions/download-artifact@v4
        with:
          name: wasm-bindings
          path: ui/src/wasm/generated

      - name: Cache node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: ui/node_modules
          key: ui-node-modules-${{ hashFiles('ui/package-lock.json', 'flake.lock') }}

      - name: Install UI dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: nix develop --command bash -c "cd ui && PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci"

      # Throwaway Synapse (oidc extra) + MAS + unix-socket Postgres, then the
      # OAuth sign-in flow through the real UI (ADR 0002 phases A+C).
      - name: Run OAuth E2E test against Synapse+MAS
        run: |
          nix shell .#oauth-stack-tools --command             nix develop --command bash scripts/spike-synapse-mas.sh --e2e

      - name: Upload Playwright report on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-oauth
          path: |
            ui/playwright-report/
            ui/test-results/
          retention-days: 7

  deploy-cloudflare:
    name: Deploy to Cloudflare Pages (site + app)
    runs-on: ubuntu-latest
    # The end-to-end jobs gate the deploy. They did not, and it cost us: the
    # two-browser suite went red on 33e8d00 and stayed red for four consecutive
    # commits, every one of which shipped to production, because this list named
    # only the unit/lint jobs. Nothing announces a red job you did not ask about.
    #
    # `always()` + an explicit failure check rather than a plain `needs`: the
    # three test jobs below are conditional on `changes.relevant`, and a plain
    # dependency on a SKIPPED job skips this one too — which would stop a
    # docs-or-site-only push from ever deploying. Skipped is fine here; failed
    # is not.
    needs: [test, fmt, clippy, ui, wasm, billing, integration, e2e, e2e-oauth]
    if: >-
      always()
      && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache Nix store
        # Upload new store paths only from main: GHA cache writes are
        # REF-scoped, so every PR's first run re-uploaded the whole store
        # (~9 min "Post Cache Nix store" tail) to its own scope. Restores
        # read main's caches cross-ref, so PRs keep the hit.
        uses: DeterminateSystems/magic-nix-cache-action@main
        with:
          use-gha-cache: ${{ github.ref == 'refs/heads/main' }}

      # Reuse the bindings the `wasm` job built (same command, same features) —
      # rebuilding here cost ~5.5 min of every main deploy for an identical
      # output. Only the UI build below is deploy-specific (VITE_ env).
      - name: Download WASM bindings
        uses: actions/download-artifact@v4
        with:
          name: wasm-bindings
          path: ui/src/wasm/generated

      # base '/' (no GITHUB_PAGES) — the app lives at the app.tidework.io root.
      - name: Build app for app.tidework.io
        run: |
          nix develop --command bash -c "cd ui && npm ci && VITE_DEFAULT_HOMESERVER=https://matrix.tidework.io npm run build"

      # Plain runner node for wrangler — npx inside `nix develop` tries to
      # install into the read-only nix store prefix and fails.
      # The site has no build step, so it has no version marker. Give it the
      # same one the app emits, purely so the check below can tell "deployed"
      # from "still serving the previous commit". Not referenced by any page —
      # the site loads no JavaScript and that stays true.
      - name: Stamp the site with this commit
        run: printf '{"build":"%s"}' "$GITHUB_SHA" > site/version.json

      - name: Deploy site (tidework.io apex)
        run: |
          npx wrangler@4 pages project create tidework-site --production-branch=main 2>/dev/null || true
          npx wrangler@4 pages deploy site --project-name=tidework-site --branch=main

      # community.tidework.io — its own tiny Pages project, so the subdomain
      # has its own root rather than serving the marketing landing page. The
      # page itself is site/community.html and stays the single source: this
      # assembles a one-page site from it at deploy time rather than keeping a
      # second copy to drift.
      - name: Deploy community page (community.tidework.io)
        run: |
          mkdir -p community-dist/fonts
          cp site/community.html community-dist/index.html
          cp site/tokens.css community-dist/tokens.css
          cp site/fonts/* community-dist/fonts/
          cp site/_headers community-dist/_headers
          npx wrangler@4 pages project create tidework-community --production-branch=main 2>/dev/null || true
          npx wrangler@4 pages deploy community-dist --project-name=tidework-community --branch=main

      - name: Deploy app (app.tidework.io)
        run: |
          npx wrangler@4 pages project create tidework-app --production-branch=main 2>/dev/null || true
          npx wrangler@4 pages deploy ui/dist --project-name=tidework-app --branch=main

      # Billing Worker (ADR 0002 phase D). Secrets are pushed every deploy —
      # the recorded two-tier exception (Cloudflare is this component's
      # runtime). The webhook secret may not exist until the Stripe endpoint
      # is created against the first deploy; tolerated until then.
      - name: Deploy billing Worker
        working-directory: billing
        run: |
          npm ci
          printf '%s' "${{ secrets.STRIPE_API_KEY }}" | npx wrangler secret put STRIPE_API_KEY || true
          printf '%s' "${{ secrets.MAS_BILLING_CLIENT_SECRET }}" | npx wrangler secret put MAS_BILLING_CLIENT_SECRET || true
          printf '%s' "${{ secrets.STRIPE_WEBHOOK_SIGNING_SECRET }}" | npx wrangler secret put STRIPE_WEBHOOK_SIGNING_SECRET || echo "  webhook secret pending (create the Stripe endpoint first)"
          npx wrangler deploy

      # Idempotent: attach custom domains to the Pages projects and ensure the
      # proxied DNS records exist. Non-fatal — a deploy shouldn't fail because
      # a domain is already attached or still validating.
      - name: Wire custom domains + DNS
        env:
          DNS_TOKEN: ${{ secrets.CLOUDFLARE_DNS_TOKEN }}
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          attach() { # project, domain
            curl -fsS -X POST               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$1/domains"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json"               --data "{\"name\":\"$2\"}" >/dev/null 2>&1 || echo "  domain $2: already attached or pending"
          }
          record() { # name, target
            existing=$(curl -fsS "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=$1"               -H "Authorization: Bearer $DNS_TOKEN" | jq -r '.result | length')
            if [ "$existing" = "0" ]; then
              curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"                 -H "Authorization: Bearer $DNS_TOKEN" -H "Content-Type: application/json"                 --data "{\"type\":\"CNAME\",\"name\":\"$1\",\"content\":\"$2\",\"proxied\":true}" >/dev/null                 && echo "  dns $1 -> $2: created" || echo "  dns $1: create failed (check manually)"
            else
              echo "  dns $1: exists"
            fi
          }
          attach tidework-site tidework.io
          attach tidework-app app.tidework.io
          attach tidework-community community.tidework.io
          record tidework.io tidework-site.pages.dev
          record app.tidework.io tidework-app.pages.dev
          record community.tidework.io tidework-community.pages.dev

      # "Merged" is not "deployed". A green CI run has repeatedly meant a stale
      # live site — a cancelled deploy, a Pages edge that had not caught up, a
      # project deployed but not attached to its domain. None of those show up
      # anywhere unless something looks at the actual URL and compares it to the
      # commit that was supposed to go out.
      #
      # Compare against the SHA, not against page content: a check that greps
      # for a string the previous build also contained passes against the old
      # deploy, which is exactly how this went unnoticed.
      - name: Verify the live deploys are this commit
        run: |
          check() { # label, url
            for attempt in $(seq 1 30); do
              live=$(curl -fsS --max-time 10 "$2" 2>/dev/null | jq -r ".build // empty" 2>/dev/null || true)
              # -n on BOTH sides. Without it an unreadable response and an
              # unset SHA are both "" and compare EQUAL, so the check that
              # exists to catch a bad deploy would pass on no data at all.
              if [ -n "$live" ] && [ -n "$GITHUB_SHA" ] && [ "$live" = "$GITHUB_SHA" ]; then
                echo "  $1: live on $GITHUB_SHA (attempt $attempt)"
                return 0
              fi
              sleep 10
            done
            echo "::error::$1 is serving '${live:-<no build id>}', expected $GITHUB_SHA"
            return 1
          }
          failed=0
          check site https://tidework.io/version.json || failed=1
          check app https://app.tidework.io/version.json || failed=1
          exit $failed

      # A purge costs nothing and closes a gap nothing else covers: a PoP that
      # still holds an HTML copy from before a fix. Cloudflare Pages invalidates
      # its OWN assets on deploy, but a zone-level cached HTML response — which
      # is what an edge-injected analytics beacon lives in — is not that.
      #
      # Skipped, loudly, when the token is absent: this needs Zone.Cache Purge,
      # which the DNS token does not carry. A silent skip would be worse than no
      # step at all, since it would read as "purged".
      - name: Purge the Cloudflare cache
        env:
          PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$PURGE_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_PURGE_TOKEN is not set — cache NOT purged. Create a token with Zone.Cache Purge on the tidework.io zone and add it as that secret."
            exit 0
          fi
          resp=$(curl -sS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $PURGE_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          if echo "$resp" | jq -e '.success == true' >/dev/null 2>&1; then
            echo "  cache purged"
          else
            echo "::error::cache purge failed: $resp"
            exit 1
          fi

      # The bytes a browser actually receives are the only place an edge-injected
      # script exists. It is in no repository, no `dist/`, and no test fixture, so
      # nothing else in this pipeline can see it — and on a product whose whole
      # claim is that the client is the trust boundary, a third-party script on
      # the app origin can read decrypted cells out of the DOM.
      - name: Audit the live pages for injected scripts
        run: python3 scripts/check-live-scripts.py --verbose
