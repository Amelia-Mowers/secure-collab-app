[package]
name = "tables-over-matrix"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "LWW-based collaborative tables over Matrix protocol with E2E encryption"

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(ruma_unstable_exhaustive_types)"]

[dependencies]
# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Matrix SDK (includes ruma re-exports — no separate ruma dep needed)
matrix-sdk = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

# When the native SQLite store is used (`matrix-native`), bundle SQLite —
# compile it from source via libsqlite3-sys — so linking needs no system
# `sqlite3.lib`. Required on Windows/MSVC (no system SQLite is present);
# harmless elsewhere (a C compiler builds the amalgamation). Version tracks the
# libsqlite3-sys that matrix-sdk-sqlite resolves, so the bundled feature unifies
# onto the same crate rather than adding a second copy.
libsqlite3-sys = { version = "0.35", features = ["bundled"], optional = true }

# WASM support
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
getrandom = { workspace = true }
tracing-wasm = { workspace = true, optional = true }

# getrandom v0.3 (transitive via matrix-sdk) needs the wasm_js feature
# for WASM targets. Including it here ensures the feature is activated.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"], optional = true }

# Additional dependencies
indexmap = { version = "2.1", features = ["serde"] }
url = "2.5"

[dev-dependencies]
proptest = { workspace = true }
quickcheck = { workspace = true }
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }

[features]
default = ["wasm"]
# Core Matrix SDK support (gates all Matrix-specific code).
# Does NOT enable a store backend — combine with matrix-wasm or matrix-native.
matrix = ["matrix-sdk", "futures"]
# Matrix for WASM targets (IndexedDB store + JS interop)
matrix-wasm = ["matrix", "matrix-sdk/indexeddb", "matrix-sdk/js", "getrandom_03"]
# Matrix for native targets (SQLite store — used by integration tests + CLI).
# Bundles SQLite so the native link needs no system sqlite3 (notably Windows).
matrix-native = ["matrix", "matrix-sdk/sqlite", "dep:libsqlite3-sys"]
# WASM bridge support (always on for our browser-first target)
wasm = ["wasm-bindgen", "wasm-bindgen-futures", "tracing-wasm"]
# Red/pending integration tests — expected to FAIL until the surface they spec
# is implemented (see docs/adr/0001-e2e-key-management.md). Excluded from CI;
# run manually with `--features matrix-native,red-tests`.
red-tests = []
