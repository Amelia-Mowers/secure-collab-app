[package]
name = "app-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Application-specific logic for the secure collaborative workspace"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(ruma_unstable_exhaustive_types)"]

[dependencies]
# Internal dependencies
tables-over-matrix = { path = "../tables-over-matrix", default-features = false }

# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

# Matrix SDK (only pulled in via feature flag)
matrix-sdk = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

# WASM support (optional — only for wasm targets)
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["console"], optional = true }
getrandom = { workspace = true, optional = true }
tracing-wasm = { workspace = true, optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
wee_alloc = { version = "0.4.5", optional = true }

# Additional dependencies
indexmap = { version = "2.1", features = ["serde"] }
url = "2"

[dev-dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }

[features]
default = ["wasm"]
# Core Matrix SDK types (gates #[cfg(feature = "matrix")] code in workspace.rs)
matrix = ["tables-over-matrix/matrix", "matrix-sdk", "futures"]
# Matrix SDK for WASM builds (IndexedDB store + JS interop)
matrix-wasm = ["matrix", "tables-over-matrix/matrix-wasm"]
# Matrix SDK for native builds (SQLite store — used by integration tests)
matrix-native = ["matrix", "tables-over-matrix/matrix-native"]
# WASM bridge support
wasm = [
    "tables-over-matrix/wasm",
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "js-sys",
    "web-sys",
    "getrandom",
    "tracing-wasm",
    "console_error_panic_hook",
    "wee_alloc",
]
